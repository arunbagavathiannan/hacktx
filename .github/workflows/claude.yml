name: Claude Code

# Mention @claude in an issue, PR comment, or review to run Claude.
# Only users with write access to this repo can trigger it (the action's default).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Token from `claude setup-token`, stored as a repo secret by an admin.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          claude_args: |
            --model claude-opus-5-5

          # Claude may not edit CLAUDE.md, its own settings, or anything in .github/.
          # CODEOWNERS + branch protection on main is what actually enforces this for people.
          settings: |
            {
              "permissions": {
                "deny": [
                  "Edit(./CLAUDE.md)",
                  "Edit(./**/CLAUDE.md)",
                  "Edit(./.claude/**)",
                  "Edit(./.github/**)"
                ]
              }
            }
